<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrace | ZAKÁZKOMAT</title><style>body{font:15px/1.5 system-ui;margin:0;background:#f4f6fa;color:#172338}main{max-width:1100px;margin:32px auto;padding:0 18px}section{background:#fff;padding:20px;border-radius:12px;margin:18px 0;overflow:auto}input,button,select{font:inherit;padding:10px;border:1px solid #ccd4df;border-radius:7px}button{cursor:pointer;background:#e7b85c;border:0;font-weight:700}table{border-collapse:collapse;width:100%;min-width:720px}td,th{text-align:left;padding:9px;border-bottom:1px solid #e4e9f0;vertical-align:top}small{color:#64748b}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><h1>◈ ZAKÁZKOMAT | Administrace</h1><p>Soukromá administrace. Přístupový token se ukládá pouze v paměti této stránky.</p><div class="row"><input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off"><button id="load">Načíst data</button><span id="msg"></span></div><section><h2>Poptávky</h2><div id="leads">Zatím nenačteno.</div></section><section><h2>Registrace firem</h2><div id="partners">Zatím nenačteno.</div></section></main><script>
let token="";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){token=document.getElementById("token").value;const msg=document.getElementById("msg");msg.textContent="Načítám…";try{const r=await fetch("/api/admin/leads",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Chyba");document.getElementById("leads").innerHTML=table(d.leads,"lead");document.getElementById("partners").innerHTML=table(d.partners,"partner");msg.textContent="Načteno."}catch(e){msg.textContent=e.message}}
function table(rows,type){if(!rows?.length)return"<p>Žádné záznamy.</p>";const cols=Object.keys(rows[0]),states=type==="partner"?["pending","approved","rejected"]:["new","contacted","assigned","closed","rejected"];return"<table><thead><tr>"+cols.map(c=>"<th>"+esc(c)+"</th>").join("")+"<th>Stav</th></tr></thead><tbody>"+rows.map(r=>"<tr>"+cols.map(c=>"<td>"+esc(r[c])+"</td>").join("")+"<td><select data-id='"+esc(r.id)+"' data-type='"+type+"'>"+states.map(s=>"<option "+(s===r.status?"selected":"")+">"+s+"</option>").join("")+"</select> <button data-save='"+esc(r.id)+"' data-type='"+type+"'>Uložit</button></td></tr>").join("")+"</tbody></table>"}
document.getElementById("load").onclick=load;document.addEventListener("click",async e=>{if(!e.target.matches("[data-save]"))return;const id=Number(e.target.dataset.save),type=e.target.dataset.type,status=document.querySelector("select[data-id='"+id+"'][data-type='"+type+"']").value;const r=await fetch("/api/admin/leads",{method:"PATCH",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({id,status,type})});document.getElementById("msg").textContent=r.ok?"Stav uložen.":"Změnu se nepodařilo uložit.";});
</script></body></html>
